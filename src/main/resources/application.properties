# ===================================================================
# Student Performance Analyzer - Application Configuration
# ===================================================================

# Database Configuration
# Compatible with TiDB Cloud, Aiven, Railway, AWS RDS, and local MySQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/factory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Resilience Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8080}

# JWT Authentication
jwt.secret=${JWT_SECRET:MyFactoryManagementSuperSecretKeyThatIsAtLeast256BitsLong2024!}
jwt.expiration=${JWT_EXPIRATION:36000000}
